[package]
name = "agentswap"
version = "0.7.0"
edition = "2024"
description = "AgentSwap CLI for requesting quotes, inspecting tokens and pools, managing V6 intents, and registering an API key against the AgentSwap service."
license = "MIT"
repository = "https://github.com/agentswapco/agentswap-cli"
keywords = ["defi", "dex", "swap", "aggregator", "cli"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

[[bin]]
name = "agentswap"
path = "src/main.rs"

[dependencies]
alloy = { version = "1.6", default-features = false, features = [
    "std", "sol-types", "contract", "network", "consensus",
    "providers", "provider-http", "reqwest", "rpc-types",
    "reqwest-rustls-tls",
    "signers", "signer-local",
] }
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
eyre = "0.6"
getrandom = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "2.1", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
zeroize = { version = "1", features = ["derive"] }
